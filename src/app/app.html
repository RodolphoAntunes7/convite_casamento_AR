<main class="infinite-container">
  @for (section of sections(); track $index) {
    <ng-container *ngComponentOutlet="section"></ng-container>
    
    @if ($index === 4) {
      <div #navTrigger class="trigger-point"></div>
    }
  }

  <div #infiniteSentinel class="sentinel"></div>

  <app-sticky-nav [class.visible]="showNav()"></app-sticky-nav>
</main>
